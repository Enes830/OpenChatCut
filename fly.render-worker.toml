# Fly.io Render Worker configuration (fallback for AWS Lambda / local VPS renders)
# Deploy with:
#   fly deploy --config fly.render-worker.toml --dockerfile Dockerfile.fly-worker

app = 'thrumming-hill-364'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile.fly-worker'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 5

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory = '4gb'
