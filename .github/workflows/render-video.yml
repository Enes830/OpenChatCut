name: Headless Video Render

on:
  workflow_dispatch:
    inputs:
      storyboard:
        description: 'Storyboard name (e.g. storyboard_1_energy_summit), or Google Doc/Sheet URL, or CSV path'
        required: true
        type: string
        default: 'storyboard_1_energy_summit'
      accent_color:
        description: 'Accent Color (hex)'
        required: false
        default: '#1283F9'

jobs:
  render:
    name: Headless Remotion Render (16GB RAM)
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Arabic Fonts
        run: |
          # Install custom Ghroob Arabic font from repository
          sudo mkdir -p /usr/local/share/fonts
          if [ -d "assets/fonts" ]; then
            sudo cp assets/fonts/*.otf /usr/local/share/fonts/ 2>/dev/null || true
          fi
          sudo fc-cache -fv

      - name: Install NPM dependencies
        run: npm ci --loglevel=error
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'

      - name: Render Selected Video(s)
        run: |
          mkdir -p csv-video-pipeline/outputs
          SB="${{ github.event.inputs.storyboard }}"
          COLOR="${{ github.event.inputs.accent_color }}"

          if [ "$SB" = "all" ]; then
            python3 csv-video-pipeline/render_pipeline.py --csv csv-video-pipeline/storyboard_1_energy_summit.csv --render --accent-color "$COLOR"
            python3 csv-video-pipeline/render_pipeline.py --csv csv-video-pipeline/storyboard_2_world_isolation.csv --render --accent-color "$COLOR"
            python3 csv-video-pipeline/render_pipeline.py --csv csv-video-pipeline/storyboard_3_economic_markets.csv --render --accent-color "$COLOR"
          elif [[ "$SB" == http* ]]; then
            python3 csv-video-pipeline/render_pipeline.py --doc "$SB" --render --accent-color "$COLOR"
          elif [ -f "csv-video-pipeline/${SB}.csv" ]; then
            python3 csv-video-pipeline/render_pipeline.py --csv "csv-video-pipeline/${SB}.csv" --render --accent-color "$COLOR"
          elif [ -f "$SB" ]; then
            python3 csv-video-pipeline/render_pipeline.py --csv "$SB" --render --accent-color "$COLOR"
          else
            python3 csv-video-pipeline/render_pipeline.py --csv "$SB" --render --accent-color "$COLOR"
          fi

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rendered-mp4-${{ github.run_id }}
          path: csv-video-pipeline/outputs/*.mp4
          retention-days: 14
