name: Headless Video Render

on:
  workflow_dispatch:
    inputs:
      storyboard:
        description: 'Storyboard to render'
        required: true
        default: 'storyboard_1_energy_summit'
        type: choice
        options:
          - 'storyboard_1_energy_summit'
          - 'storyboard_2_world_isolation'
          - 'storyboard_3_economic_markets'
          - 'storyboard_4_breaking_news'
          - 'all'
      accent_color:
        description: 'Accent Color (hex)'
        required: false
        default: '#0f83f3'

jobs:
  render:
    name: Headless Remotion Render (16GB RAM)
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Arabic Fonts
        run: |
          # Install custom Ghroob Arabic font from repository
          sudo mkdir -p /usr/local/share/fonts
          if [ -d "assets/fonts" ]; then
            sudo cp assets/fonts/*.otf /usr/local/share/fonts/ 2>/dev/null || true
          fi
          sudo fc-cache -fv

      - name: Install NPM dependencies
        run: npm ci --loglevel=error
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'

      - name: Render Selected Video(s)
        run: |
          mkdir -p csv-video-pipeline/outputs
          if [ "${{ github.event.inputs.storyboard }}" = "all" ]; then
            python3 csv-video-pipeline/render_pipeline.py --csv csv-video-pipeline/storyboard_1_energy_summit.csv --render --accent-color "${{ github.event.inputs.accent_color }}"
            python3 csv-video-pipeline/render_pipeline.py --csv csv-video-pipeline/storyboard_2_world_isolation.csv --render --accent-color "${{ github.event.inputs.accent_color }}"
            python3 csv-video-pipeline/render_pipeline.py --csv csv-video-pipeline/storyboard_3_economic_markets.csv --render --accent-color "${{ github.event.inputs.accent_color }}"
          else
            python3 csv-video-pipeline/render_pipeline.py --csv "csv-video-pipeline/${{ github.event.inputs.storyboard }}.csv" --render --accent-color "${{ github.event.inputs.accent_color }}"
          fi

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rendered-mp4-${{ github.event.inputs.storyboard }}
          path: csv-video-pipeline/outputs/*.mp4
          retention-days: 14
