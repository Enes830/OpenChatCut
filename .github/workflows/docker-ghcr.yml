name: Build and Deploy OpenChatCut Docker to GHCR

on:
  push:
    branches:
      - custom
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case owner and image name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${REPO_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Container to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set lower case owner and image name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${REPO_LOWER}" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🔐 Logging into GHCR on VPS..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}

            cd /home/deploy/openchatcut
            echo "📥 Syncing latest repo files..."
            git fetch origin custom
            git reset --hard origin/custom

            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export DOCKER_IMAGE="${{ env.REGISTRY }}/${REPO_LOWER}:latest"

            echo "🐳 Pulling latest Docker image: $DOCKER_IMAGE ..."
            docker pull $DOCKER_IMAGE

            echo "🛑 Stopping PM2 openchatcut service to release port 5174..."
            pm2 stop openchatcut 2>/dev/null || true
            pm2 save 2>/dev/null || true

            echo "🚀 Starting OpenChatCut container via Docker Compose..."
            DOCKER_IMAGE=$DOCKER_IMAGE docker compose down --remove-orphans || true
            DOCKER_IMAGE=$DOCKER_IMAGE docker compose up -d --remove-orphans

            echo "🔍 Verifying running container..."
            docker compose ps
            echo "⏳ Waiting for container to warm up and accept traffic..."
            for i in $(seq 1 15); do
              if curl -s -f -I http://127.0.0.1:5174 >/dev/null 2>&1; then
                echo "✅ Container is responding with HTTP 200 after ${i} checks!"
                break
              fi
              echo "Waiting for Vite preview server... ($i/15)"
              sleep 2
            done
            curl -f -I http://127.0.0.1:5174 || (echo "❌ Server healthcheck failed. Container logs:" && docker compose logs --tail 50 && exit 1)
            docker image prune -f || true
            echo "✅ OpenChatCut Docker deployment completed successfully!"
