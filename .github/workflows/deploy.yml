name: Auto Deploy OpenChatCut to VPS

on:
  push:
    branches:
      - custom
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            export PATH=/home/deploy/.nvm/versions/node/v24.19.0/bin:$PATH
            cd /home/deploy/openchatcut
            echo "📥 Pulling latest code..."
            git fetch origin custom
            git reset --hard origin/custom
            echo "📦 Installing dependencies..."
            npm install
            echo "🏗️ Building production bundle..."
            npm run build
            echo "🔄 Restarting service with PM2..."
            pm2 restart openchatcut || pm2 start "node_modules/vite/bin/vite.js" --name "openchatcut" -- preview --config config/vite.config.ts --port 5174 --host 0.0.0.0
            pm2 save
            echo "✅ Deployment completed successfully!"
