services:
  openchatcut:
    image: ${DOCKER_IMAGE:-ghcr.io/kashidatech/kashida-editor:latest}
    container_name: openchatcut-editor
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:5174"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - OPENCHATCUT_ALLOW_REMOTE_HOSTS=1
      - OPENCHATCUT_EDITOR_URL=https://editor.kashida.io
      - OPENCHATCUT_DATA_DIR=/data
      - BROWSER=none
    volumes:
      - /home/deploy/.openchatcut:/data
      - /home/deploy/openchatcut/public/media/uploads:/app/public/media/uploads
